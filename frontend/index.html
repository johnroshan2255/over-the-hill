<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e9c9a8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>overhill</title>
    <link rel="icon" href="data:," />
    <!-- the UI's type: Anton (titles), Barlow Condensed (everything else) — condensed, upper-case, GTA-like -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0d; overscroll-behavior: none; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; }
      canvas { display: block; }
      button { border-radius: 0; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; color: #f4efe6; font: 700 16px 'Barlow Condensed', system-ui; letter-spacing: .2em; text-transform: uppercase; }
      /* the speedometer: bottom right, a plate (HUD info — the menus' square look) */
      #drive { position: fixed; right: 16px; bottom: 14px; color: #f4efe6; pointer-events: none; text-align: right; }
      #drive .spd { display: inline-block; min-width: 128px; padding: 4px 12px 6px; background: rgba(8, 8, 10, .55); border-right: 4px solid #f2a93b; }
      #drive .spd b { font-size: 48px; font-weight: 700; letter-spacing: 0; line-height: 1; }
      #drive .spd span { font-size: 15px; margin-left: 4px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
      #drive .spd i { display: block; font-style: normal; font-size: 15px; font-weight: 700; letter-spacing: .14em; opacity: .85; }
      #drive .spd em { display: block; font-style: normal; font-size: 14px; font-weight: 600; letter-spacing: .14em; opacity: .7; }
      /* THE GEARS (Manual gearbox): a small plate left of the speed — ▲ up, the gear, ▼ down; clickable, its keys shown */
      .oth-perftag { position: fixed; z-index: 6; left: 50%; top: 64px; transform: translateX(-50%); padding: 3px 8px; background: rgba(8, 8, 10, .7); color: #ff5a4a; font: 600 11px/1.2 var(--oh-ui, system-ui); letter-spacing: .08em; pointer-events: none; }
      .oth-gears { display: none; vertical-align: bottom; margin-right: 6px; pointer-events: auto; background: rgba(8, 8, 10, .55); text-align: center; }
      .oth-gears.on { display: inline-flex; flex-direction: column; align-items: stretch; }
      .oth-gears b { display: block; padding: 0 10px; font-size: 26px; font-weight: 700; line-height: 1.05; color: #f2a93b; }
      .oth-gears button { position: relative; width: 52px; height: 28px; padding: 0; border: 0; background: rgba(244, 239, 230, .1); color: #f4efe6; font: 700 15px 'Barlow Condensed', system-ui, sans-serif; cursor: pointer; }
      .oth-gears button:hover { background: rgba(244, 239, 230, .2); }
      .oth-gears button:active { background: #f2a93b; color: #120c04; }
      .oth-gears kbd { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font: 600 10px 'Barlow Condensed', system-ui, sans-serif; letter-spacing: .08em; opacity: .55; }
      /* (touch: the gear box above the pedals, bigger thumbs, no key hints) */
      body.touch .oth-gears { position: fixed; z-index: 5; right: calc(118px + env(safe-area-inset-right)); bottom: calc(98px + env(safe-area-inset-bottom)); margin: 0; color: #f4efe6; background: rgba(8, 8, 10, .35); }
      body.touch .oth-gears button { width: 54px; height: 40px; font-size: 18px; }
      body.touch .oth-gears b { font-size: 20px; }
      body.touch .oth-gears kbd { display: none; }
      #drive .help { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 660px); padding: 3px 10px; background: rgba(8, 8, 10, .5); font-size: 12px; font-weight: 600; letter-spacing: .1em; line-height: 1.4; text-align: center; text-transform: uppercase; opacity: .85; }
      @media (max-width: 1080px) { #drive .help { display: none; } }
      /* the CONTROLS: round, light, see-through — easy to hit, easy to see past (the menus stay square) */
      .oth-fs, .oth-menubtn, .oth-touch button {
        border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); background: rgba(10, 10, 12, .28); color: #fff;
        font: 700 18px 'Barlow Condensed', system-ui; line-height: 1; touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent; transition: background .08s, transform .08s; cursor: pointer;
      }
      .oth-fs:active, .oth-menubtn:active, .oth-touch button:active, .oth-fs.on, .oth-menubtn.on { background: rgba(242, 169, 59, .85); border-color: #f2a93b; color: #120c04; }
      .oth-fs:active, .oth-menubtn:active, .oth-touch button:active { transform: scale(.94); }
      /* THE TOP-RIGHT CORNER (every screen): full screen in the corner, the action wheel's button beside it (Wheel.ts) */
      .oth-fs, .oth-menubtn { position: fixed; top: calc(12px + env(safe-area-inset-top)); width: 42px; height: 42px; padding: 0; display: grid; place-items: center; }
      .oth-fs { right: calc(14px + env(safe-area-inset-right)); z-index: 26; }
      .oth-menubtn { right: calc(64px + env(safe-area-inset-right)); z-index: 12; }
      body.oth-fs-none .oth-menubtn { right: calc(14px + env(safe-area-inset-right)); }
      /* the API the game draws with: a small tag on the menu button's corner (amber WebGPU, grey WebGL2) */
      .oth-menubtn[data-api]::after { content: attr(data-api); position: absolute; left: -7px; bottom: -6px; padding: 2px 3px 1px; border-radius: 3px; background: #f2a93b; color: #120c04; font: 700 8px/1 'Barlow Condensed', system-ui; letter-spacing: .06em; pointer-events: none; }
      .oth-menubtn.gl2[data-api]::after { background: #9a9da3; }
      body.oh-panel-open .oth-fs { display: none; } /* (the garage / settings panels have their coins up there) */
      @media (hover: hover) { .oth-fs:hover, .oth-menubtn:hover { border-color: #f2a93b; } }
      /* THE ACTION WHEEL: the ring over a dimmed screen — dark sectors, the one under the finger white (GTA's) */
      .oth-wheel { position: fixed; inset: 0; z-index: 11; display: none; place-items: center; background: radial-gradient(circle, rgba(6, 6, 8, .3), rgba(6, 6, 8, .72)); touch-action: none; }
      .oth-wheel.on { display: grid; }
      .oth-wheel svg { width: min(86vmin, 460px); height: min(86vmin, 460px); overflow: visible; }
      .oth-wheel .bg { fill: rgba(10, 10, 12, .78); stroke: rgba(244, 239, 230, .2); stroke-width: .6; transition: fill .06s; }
      .oth-wheel .ic { fill: none; stroke: #f4efe6; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .oth-wheel .sec text { fill: #f4efe6; font: 700 8px 'Barlow Condensed', system-ui; letter-spacing: .1em; text-anchor: middle; }
      .oth-wheel .sec.lit .ic { stroke: #f2a93b; }
      .oth-wheel .sec.lit text { fill: #f2a93b; }
      .oth-wheel .sec.sel .bg { fill: #f4efe6; stroke: #f2a93b; stroke-width: 1.4; }
      .oth-wheel .sec.sel .ic { stroke: #0b0b0d; }
      .oth-wheel .sec.sel text { fill: #0b0b0d; }
      .oth-wheel .hub { fill: rgba(8, 8, 10, .86); stroke: #f2a93b; stroke-width: 1.6; }
      .oth-wheel .hub-t { fill: #f4efe6; font: 400 12px 'Anton', 'Barlow Condensed', system-ui; letter-spacing: .05em; text-anchor: middle; }
      .oth-wheel .hub-s { fill: rgba(244, 239, 230, .62); font: 700 6.5px 'Barlow Condensed', system-ui; letter-spacing: .14em; text-anchor: middle; }
      body.oth-wheel-open .oth-touch, body.oth-wheel-open .oth-campbtn { visibility: hidden; }
      body.oth-free .oth-touch, body.oth-free .oth-door, body.oth-free .oth-campbtn { display: none !important; }
      /* THE THUMB PADS (touch screens): only what you drive with — the rest is in the wheel. LANDSCAPE first: steering
         bottom left, pedals bottom right, the speed between them */
      .oth-touch button { position: fixed; z-index: 5; display: grid; place-items: center; padding: 0; letter-spacing: .08em; }
      .oth-touch [data-k=left], .oth-touch [data-k=right] { bottom: calc(16px + env(safe-area-inset-bottom)); width: 72px; height: 72px; font-size: 22px; }
      .oth-touch [data-k=left] { left: calc(16px + env(safe-area-inset-left)); }
      .oth-touch [data-k=right] { left: calc(100px + env(safe-area-inset-left)); }
      .oth-touch [data-k=gas] { right: calc(16px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 88px; height: 88px; font-size: 17px; }
      .oth-touch [data-k=brake] { right: calc(114px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 68px; height: 68px; font-size: 14px; }
      /* the BIKE: HOP over the pedals, LEAN ▲ ▼ beside the steering; no gears (it shifts itself) */
      .oth-touch .bk { display: none; }
      .oth-touch.bike .bk { display: grid; }
      /* on FOOT: the STICK where the steering is, JUMP where the pedals are; no pedals, no lean, no gears */
      .oth-touch.foot [data-k=hop] { display: grid; right: calc(28px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); width: 82px; height: 82px; font-size: 0; }
      .oth-touch.foot [data-k=hop]::after { content: 'JUMP'; font-size: 16px; }
      .oth-touch.foot [data-k=left], .oth-touch.foot [data-k=right], .oth-touch.foot [data-k=gas], .oth-touch.foot [data-k=brake],
      .oth-touch.foot [data-k=up], .oth-touch.foot [data-k=down] { display: none; }
      .oth-stick { display: none; position: fixed; z-index: 5; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .45); background: rgba(10, 10, 12, .22); touch-action: none; }
      .oth-stick i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(244, 239, 230, .55); border: 2px solid rgba(255, 255, 255, .7); }
      .oth-touch.foot .oth-stick { display: block; }
      .oth-touch .oth-sprint { display: none; right: calc(124px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 64px; height: 64px; font-size: 12px; }
      .oth-touch.foot .oth-sprint { display: grid; }
      @media (orientation: portrait) { .oth-touch .oth-sprint { right: calc(116px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 58px; height: 58px; } }
      /* THE DOOR button (touch): out of / into what's nearest — only when there's something to do; above the right
         thumb's pads */
      .oth-door { display: none; position: fixed; z-index: 5; right: calc(24px + env(safe-area-inset-right)); bottom: calc(196px + env(safe-area-inset-bottom)); width: 58px; height: 58px; padding: 0; border-radius: 50%; border: 2px solid #f2a93b; background: rgba(242, 169, 59, .32); color: #fff; place-items: center; touch-action: none; -webkit-tap-highlight-color: transparent; }
      .oth-door span { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; white-space: nowrap; color: #f4efe6; font: 700 11px 'Barlow Condensed', system-ui; letter-spacing: .1em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
      body.touch .oth-door.on { display: grid; }
      .oth-door:active { background: rgba(242, 169, 59, .85); color: #120c04; }
      body.oth-wheel-open .oth-door { visibility: hidden; }
      @media (orientation: portrait) { .oth-door { bottom: calc(222px + env(safe-area-inset-bottom)); right: calc(22px + env(safe-area-inset-right)); } }
      /* (a short screen — a phone sideways with its bars: the stick smaller, the door up under the coins, its word to
         its left) */
      @media (orientation: landscape) and (max-height: 380px) {
        .oth-stick { width: 106px; height: 106px; left: calc(16px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); }
        .oth-stick i { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
        .oth-door { bottom: auto; top: calc(92px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right)); width: 46px; height: 46px; }
        .oth-door span { top: 50%; left: auto; right: 100%; transform: translateY(-50%); margin: 0 6px 0 0; }
      }
      .oth-touch [data-k=hop] { right: calc(30px + env(safe-area-inset-right)); bottom: calc(120px + env(safe-area-inset-bottom)); width: 60px; height: 60px; font-size: 13px; }
      .oth-touch [data-k=leanF], .oth-touch [data-k=leanB] { left: calc(184px + env(safe-area-inset-left)); width: 46px; height: 46px; font-size: 16px; }
      .oth-touch [data-k=leanF] { bottom: calc(72px + env(safe-area-inset-bottom)); }
      .oth-touch [data-k=leanB] { bottom: calc(16px + env(safe-area-inset-bottom)); }
      /* PHONES: more of the screen for the game — the corner buttons a little smaller, the speed a slim read-out */
      body.touch .oth-fs, body.touch .oth-menubtn { top: calc(10px + env(safe-area-inset-top)); width: 40px; height: 40px; }
      body.touch .oth-fs { right: calc(12px + env(safe-area-inset-right)); }
      body.touch .oth-menubtn { right: calc(60px + env(safe-area-inset-right)); }
      body.touch.oth-fs-none .oth-menubtn { right: calc(12px + env(safe-area-inset-right)); }
      body.touch #drive { left: 50%; right: auto; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); text-align: center; white-space: nowrap; }
      body.touch #drive .spd { min-width: 0; padding: 2px 10px 3px; background: rgba(8, 8, 10, .32); border-right: 0; border-bottom: 3px solid #f2a93b; }
      body.touch #drive .spd b { font-size: 30px; }
      body.touch #drive .spd span { font-size: 12px; }
      body.touch #drive .spd i, body.touch #drive .spd em { display: inline; margin-left: 8px; font-size: 12px; }
      body.touch .oth-compass { top: calc(8px + env(safe-area-inset-top)); width: 420px; min-width: 0; max-width: calc(100vw - 224px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
      body.touch.oth-radar-shown .oth-compass { max-width: calc(100vw - 352px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
      /* PORTRAIT: no room between the thumbs — smaller pads, the speed above them, the compass a row of its own
         under the corner buttons, the coins top left */
      @media (orientation: portrait) {
        body.touch #drive { bottom: calc(96px + env(safe-area-inset-bottom)); }
        body.touch .oth-compass, body.touch.oth-radar-shown .oth-compass { top: calc(58px + env(safe-area-inset-top)); max-width: calc(100vw - 24px); }
        .oth-touch [data-k=left], .oth-touch [data-k=right] { bottom: calc(14px + env(safe-area-inset-bottom)); width: 64px; height: 64px; }
        .oth-touch [data-k=left] { left: calc(12px + env(safe-area-inset-left)); }
        .oth-touch [data-k=right] { left: calc(84px + env(safe-area-inset-left)); }
        .oth-touch [data-k=gas] { right: calc(12px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 76px; height: 76px; font-size: 15px; }
        .oth-touch [data-k=brake] { right: calc(96px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); width: 60px; height: 60px; font-size: 13px; }
        body.touch .oth-gears { right: calc(22px + env(safe-area-inset-right)); bottom: calc(100px + env(safe-area-inset-bottom)); }
        .oth-touch [data-k=hop] { right: calc(22px + env(safe-area-inset-right)); bottom: calc(104px + env(safe-area-inset-bottom)); width: 56px; height: 56px; }
        .oth-touch [data-k=leanF], .oth-touch [data-k=leanB] { left: calc(12px + env(safe-area-inset-left)); }
        .oth-touch [data-k=leanF] { bottom: calc(144px + env(safe-area-inset-bottom)); }
        .oth-touch [data-k=leanB] { bottom: calc(90px + env(safe-area-inset-bottom)); }
      }
      /* coins: top right, a pop of "+25" when they change */
      .oth-coins { position: fixed; right: calc(14px + env(safe-area-inset-right)); top: calc(64px + env(safe-area-inset-top)); padding: 4px 12px 3px; background: rgba(8, 8, 10, .55); border-right: 4px solid #f2a93b; color: #f2a93b; font: 400 22px 'Anton', 'Barlow Condensed', system-ui; letter-spacing: .04em; pointer-events: none; z-index: 4; }
      .oth-coins::after { content: attr(data-d); position: absolute; right: 8px; top: 100%; color: #f4efe6; font: 700 16px 'Barlow Condensed', system-ui; opacity: 0; }
      .oth-coins.pop::after { animation: oth-pop 1.4s ease-out; }
      /* PlayCanvas's MiniStats (F3 / ?stats=1) draws into the game's canvas, bottom left: the signpost steps aside
         while it shows */
      body.oth-stats .oth-sign { left: 196px; }
      @keyframes oth-pop { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: translateY(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
      /* the signpost's boards (GTA-like plate, bottom left) */
      .oth-sign { position: fixed; left: 16px; bottom: 40px; min-width: 250px; padding: 8px 12px 9px; background: rgba(8, 8, 10, .66); border-left: 4px solid #f2a93b; color: #f4efe6; font: 700 15px 'Barlow Condensed', system-ui; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; z-index: 4; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
      .oth-sign.on { opacity: 1; transform: none; }
      /* a NOTE found at a place (Sites.ts): the sign's panel, wider, the text in sentence case */
      .oth-note { left: 50%; bottom: 120px; width: min(520px, calc(100vw - 32px)); min-width: 0; transform: translate(-50%, 8px); text-transform: none; letter-spacing: .02em; font: 500 17px/1.4 'Barlow Condensed', system-ui; }
      .oth-note.on { transform: translate(-50%, 0); }
      .oth-note small { display: block; margin-bottom: 2px; color: #f2a93b; font: 700 12px 'Barlow Condensed', system-ui; letter-spacing: .14em; text-transform: uppercase; }
      body.touch .oth-note { left: 50%; top: auto; bottom: calc(150px + env(safe-area-inset-bottom)); font-size: 15px; }
      .oth-sign b { display: block; margin-bottom: 4px; color: #f2a93b; font: 400 18px 'Anton', 'Barlow Condensed', system-ui; letter-spacing: .06em; }
      .oth-sign div { display: flex; gap: 8px; align-items: baseline; line-height: 1.5; }
      .oth-sign i { width: 18px; font-style: normal; color: #f2a93b; }
      .oth-sign span { margin-left: auto; padding-left: 14px; opacity: .7; }
      /* the camp prompt (keyboard) and button (touch) */
      .oth-prompt { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); padding: 5px 12px 4px; background: rgba(8, 8, 10, .62); color: #f4efe6; font: 700 15px 'Barlow Condensed', system-ui; letter-spacing: .12em; text-transform: uppercase; pointer-events: none; z-index: 4; display: none; }
      .oth-prompt.on { display: block; }
      .oth-prompt kbd { margin-right: 8px; padding: 0 6px; background: #f4efe6; color: #0b0b0d; font: 700 13px 'Barlow Condensed', system-ui; }
      .oth-campbtn { display: none; position: fixed; z-index: 5; width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); background: rgba(242, 169, 59, .4); color: #fff; font: 700 12px 'Barlow Condensed', system-ui; letter-spacing: .06em; touch-action: none; }
      /* (touch: CAMP a pill over the speed, only when you can — GTA's contextual prompt) */
      body.touch .oth-campbtn.on { display: grid; place-items: center; left: 50%; transform: translateX(-50%); bottom: calc(58px + env(safe-area-inset-bottom)); width: auto; height: 36px; padding: 0 20px; border-radius: 18px; font-size: 14px; letter-spacing: .14em; }
      @media (orientation: portrait) { body.touch .oth-campbtn.on { bottom: calc(142px + env(safe-area-inset-bottom)); } }
      body.touch .oth-prompt { display: none; }
      body.touch .oth-coins { top: calc(58px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); font-size: 18px; padding: 2px 9px 1px; }
      body.touch .oth-sign { left: calc(176px + env(safe-area-inset-left)); bottom: auto; top: calc(62px + env(safe-area-inset-top)); min-width: 200px; font-size: 13px; }
      @media (orientation: portrait) { body.touch .oth-coins { left: calc(12px + env(safe-area-inset-left)); right: auto; top: calc(17px + env(safe-area-inset-top)); } }
      /* a rest: the screen fades to black and back */
      .oth-fade { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #050506; color: #f4efe6; font: 400 28px 'Anton', 'Barlow Condensed', system-ui; letter-spacing: .1em; text-transform: uppercase; opacity: 0; transition: opacity .6s; pointer-events: none; }
      .oth-fade.on { opacity: 1; }
      /* the map: the worlds' tabs over the chart, the route and its buttons under it */
      .oth-map { position: fixed; inset: 0; display: none; place-content: center; gap: 4px; background: rgba(6, 6, 8, .62); z-index: 8; }
      .oth-map.on { display: grid; }
      .oth-map canvas { justify-self: center; border: 3px solid #f4efe6; box-shadow: 0 0 0 4px rgba(8, 8, 10, .6); cursor: crosshair; touch-action: none; }
      .oth-map-bar, .oth-map-foot { display: flex; align-items: stretch; gap: 4px; min-width: 0; color: #f4efe6; font: 700 15px 'Barlow Condensed', system-ui; letter-spacing: .14em; text-transform: uppercase; }
      .oth-map button { padding: 5px 14px 4px; border: 0; border-radius: 0; background: rgba(8, 8, 10, .78); color: rgba(244, 239, 230, .62); font: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; cursor: pointer; }
      .oth-map-tabs { display: flex; gap: 4px; }
      .oth-map-tabs button.sel { background: #f4efe6; color: #0b0b0d; box-shadow: inset 0 -3px 0 #f2a93b; }
      .oth-map-info { flex: 1; min-width: 0; padding: 5px 12px 4px; background: rgba(8, 8, 10, .55); color: rgba(244, 239, 230, .75); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
