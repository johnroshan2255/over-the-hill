<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080" style="width:1920px;height:1080px;display:block"></canvas>

  mad: ['v = v * 1.0001 + 0.0013;', 'v = v * 1.0001 + 0.0013;'],
  pow: ['v = pow(abs(v) + 0.1, vec4(1.003)) ;', 'v = pow(abs(v) + 0.1, vec4f(1.003));'],
  sin: ['v = sin(v) * 1.1;', 'v = sin(v) * 1.1;'],
  exp: ['v = exp(-abs(v)) + 0.3;', 'v = exp(-abs(v)) + 0.3;'],

  norm: ['v = vec4(normalize(v.xyz + 0.01), v.w) * 1.01;', 'v = vec4f(normalize(v.xyz + 0.01), v.w) * 1.01;'],
  tex: ['v += texture(t, v.xy * 0.37 + uv);', 'v += textureSample(t, s, v.xy * 0.37 + uv);'],

window.__ms = runs[1]
